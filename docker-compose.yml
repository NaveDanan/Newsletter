services:
  newsletter:
    image: newsletter:latest
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        pocketbase-dist: ${POCKETBASE_DIST_DIR}
    environment:
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      POCKETBASE_APP_NAME: ${POCKETBASE_APP_NAME:-}
      POCKETBASE_SUPERUSER_EMAIL: ${POCKETBASE_SUPERUSER_EMAIL}
      POCKETBASE_SUPERUSER_PASSWORD: ${POCKETBASE_SUPERUSER_PASSWORD}
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-}
      POCKETBASE_MAIL_SENDER_NAME: ${POCKETBASE_MAIL_SENDER_NAME:-}
      POCKETBASE_MAIL_SENDER_ADDRESS: ${POCKETBASE_MAIL_SENDER_ADDRESS:-}
      POCKETBASE_PUBLIC_URL: ${POCKETBASE_PUBLIC_URL:-}
      POCKETBASE_SMTP_ENABLED: ${POCKETBASE_SMTP_ENABLED:-}
      POCKETBASE_SMTP_HOST: ${POCKETBASE_SMTP_HOST:-}
      POCKETBASE_SMTP_PORT: ${POCKETBASE_SMTP_PORT:-}
      POCKETBASE_SMTP_USERNAME: ${POCKETBASE_SMTP_USERNAME:-}
      POCKETBASE_SMTP_PASSWORD: ${POCKETBASE_SMTP_PASSWORD:-}
      POCKETBASE_SMTP_AUTH_METHOD: ${POCKETBASE_SMTP_AUTH_METHOD:-}
      POCKETBASE_SMTP_TLS: ${POCKETBASE_SMTP_TLS:-}
      POCKETBASE_SMTP_LOCAL_NAME: ${POCKETBASE_SMTP_LOCAL_NAME:-}
      POCKETBASE_RECREATE_COLLECTIONS: ${POCKETBASE_RECREATE_COLLECTIONS:-0}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
      - "${POCKETBASE_PORT:-8090}:8090"
    volumes:
      - pocketbase_data:/pb_data

volumes:
  pocketbase_data: