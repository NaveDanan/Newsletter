image:
  repository: ghcr.io/example/newsletter
  tag: dev

credentials:
  superuserEmail: superuser@example.com
  superuserPassword: change-this-password
  adminEmail: admin@example.com
  adminPassword: change-this-password
  smtpUsername: ""
  smtpPassword: ""

env:
  appPublicUrl: https://newsletter.localtest.me
  pocketbaseAppName: AI-BREAK
  pocketbaseMailSenderName: AI-BREAK
  pocketbaseMailSenderAddress: newsletter@localtest.me
  pocketbasePublicUrl: https://pocketbase.localtest.me
  pocketbaseSmtpEnabled: false
  pocketbaseSmtpHost: smtp.localtest.me
  pocketbaseSmtpPort: 587
  pocketbaseSmtpAuthMethod: PLAIN
  pocketbaseSmtpTls: false
  pocketbaseSmtpLocalName: ""
  pocketbaseRecreateCollections: false

persistence:
  enabled: true
  size: 5Gi

ingress:
  frontend:
    enabled: true
    className: nginx
    annotations: {}
    host: newsletter.localtest.me
    path: /
    pathType: Prefix
    tls: []
  pocketbase:
    enabled: true
    className: nginx
    annotations: {}
    host: pocketbase.localtest.me
    path: /
    pathType: Prefix
    tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
