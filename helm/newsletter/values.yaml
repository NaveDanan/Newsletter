replicaCount: 1

image:
  registry: ""
  repository: your-org/newsletter
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

deploymentStrategy:
  type: Recreate

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  annotations: {}
  ports:
    frontend: 80
    pocketbase: 8090

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}
  mountPath: /pb_data

credentials:
  existingSecret: ""
  superuserEmail: superuser@example.com
  superuserPassword: change-this-password
  adminEmail: admin@example.com
  adminPassword: change-this-password
  smtpUsername: ""
  smtpPassword: ""
  ssoOidcClientSecret: ""

env:
  appPublicUrl: ""
  pocketbaseAppName: "AI-BREAK"
  pocketbaseMailSenderName: "AI-BREAK"
  pocketbaseMailSenderAddress: "newsletter@example.com"
  pocketbasePublicUrl: ""
  pocketbaseSmtpEnabled: false
  pocketbaseSmtpHost: ""
  pocketbaseSmtpPort: 587
  pocketbaseSmtpAuthMethod: "PLAIN"
  pocketbaseSmtpTls: false
  pocketbaseSmtpInsecureSkipVerify: false
  pocketbaseSmtpLocalName: ""
  pocketbaseSsoOidcEnabled: false
  pocketbaseSsoOidcProviderName: "oidc"
  pocketbaseSsoOidcDisplayName: "Company SSO"
  pocketbaseSsoOidcClientId: ""
  pocketbaseSsoOidcAuthUrl: ""
  pocketbaseSsoOidcTokenUrl: ""
  pocketbaseSsoOidcUserInfoUrl: ""
  pocketbaseSsoOidcPkce: true
  pocketbaseRecreateCollections: false
  newsletterTelemetry: false

extraEnv: []
# - name: NODE_ENV
#   value: production

ingress:
  frontend:
    enabled: false
    className: ""
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "110m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    host: newsletter.local
    path: /
    pathType: Prefix
    tls: []
  pocketbase:
    enabled: false
    className: ""
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "110m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    host: pocketbase.local
    path: /
    pathType: Prefix
    tls: []

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
