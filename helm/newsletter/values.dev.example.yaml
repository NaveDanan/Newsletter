image:
  registry: ghcr.io
  repository: example/newsletter
  tag: dev

credentials:
  superuserEmail: superuser@example.com
  superuserPassword: change-this-password
  adminEmail: admin@example.com
  adminPassword: change-this-password
  smtpUsername: ""
  smtpPassword: ""
  ssoOidcClientSecret: ""

env:
  appPublicUrl: https://newsletter.localtest.me
  pocketbaseAppName: AI-BREAK
  pocketbaseMailSenderName: AI-BREAK
  pocketbaseMailSenderAddress: newsletter@localtest.me
  pocketbasePublicUrl: https://pocketbase.localtest.me
  pocketbaseSmtpEnabled: false
  pocketbaseSmtpHost: smtp.localtest.me
  pocketbaseSmtpPort: 587
  pocketbaseSmtpAuthMethod: PLAIN
  pocketbaseSmtpTls: false
  pocketbaseSmtpInsecureSkipVerify: true
  pocketbaseSmtpLocalName: ""
  pocketbaseSsoOidcEnabled: false
  pocketbaseSsoOidcProviderName: oidc
  pocketbaseSsoOidcDisplayName: Company SSO
  pocketbaseSsoOidcClientId: ""
  pocketbaseSsoOidcAuthUrl: https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/authorize
  pocketbaseSsoOidcTokenUrl: https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/token
  pocketbaseSsoOidcUserInfoUrl: https://graph.microsoft.com/oidc/userinfo
  pocketbaseSsoOidcPkce: true
  pocketbaseRecreateCollections: false

persistence:
  enabled: true
  size: 5Gi

ingress:
  frontend:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "110m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    host: newsletter.localtest.me
    path: /
    pathType: Prefix
    tls: []
  pocketbase:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "110m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    host: pocketbase.localtest.me
    path: /
    pathType: Prefix
    tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
