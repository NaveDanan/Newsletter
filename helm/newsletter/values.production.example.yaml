image:
  registry: registry.example.com
  repository: newsletter
  tag: 2026.04.12
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: regcred

credentials:
  existingSecret: newsletter-pocketbase-env
  smtpUsername: ""
  smtpPassword: ""

env:
  appPublicUrl: https://newsletter.example.com
  pocketbaseAppName: AI-BREAK
  pocketbaseMailSenderName: AI-BREAK
  pocketbaseMailSenderAddress: newsletter@example.com
  pocketbasePublicUrl: https://pb.example.com
  pocketbaseSmtpEnabled: true
  pocketbaseSmtpHost: smtp.example.com
  pocketbaseSmtpPort: 587
  pocketbaseSmtpAuthMethod: PLAIN
  pocketbaseSmtpTls: false
  pocketbaseSmtpLocalName: ""
  pocketbaseRecreateCollections: false

persistence:
  enabled: true
  storageClass: fast-ssd
  size: 20Gi

ingress:
  frontend:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    host: newsletter.example.com
    path: /
    pathType: Prefix
    tls:
      - secretName: newsletter-tls
        hosts:
          - newsletter.example.com
  pocketbase:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    host: pb.example.com
    path: /
    pathType: Prefix
    tls:
      - secretName: pocketbase-tls
        hosts:
          - pb.example.com

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
