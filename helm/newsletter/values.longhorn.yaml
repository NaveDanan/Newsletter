# Apply after your environment values. Requires Longhorn in the target cluster.
# Setup and migration: docs/longhorn.md
replicaCount: 1

deploymentStrategy:
  type: Recreate

persistence:
  enabled: true
  storageClass: longhorn
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  mountPath: /pb_data
  # existingClaim is intentionally inherited. If set, that claim's actual
  # storage class is used; this profile cannot convert an existing NFS claim.

env:
  pocketbaseRecreateCollections: false
