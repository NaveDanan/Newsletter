image:
  registry: registry.example.com
  repository: newsletter
  tag: 2026.04.12
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: regcred

credentials:
  existingSecret: newsletter-pocketbase-env
  smtpUsername: ""
  smtpPassword: ""
  ssoOidcClientSecret: ""

env:
  appPublicUrl: https://newsletter.example.com
  pocketbaseAppName: AI-BREAK
  pocketbaseMailSenderName: AI-BREAK
  pocketbaseMailSenderAddress: newsletter@example.com
  pocketbasePublicUrl: https://pb.example.com
  pocketbaseSmtpEnabled: true
  pocketbaseSmtpHost: smtp.example.com
  pocketbaseSmtpPort: 587
  pocketbaseSmtpAuthMethod: PLAIN
  pocketbaseSmtpTls: false
  pocketbaseSmtpInsecureSkipVerify: false
  pocketbaseSmtpLocalName: ""
  pocketbaseSsoOidcEnabled: true
  pocketbaseSsoOidcProviderName: oidc
  pocketbaseSsoOidcDisplayName: Company SSO
  pocketbaseSsoOidcClientId: your-entra-application-client-id
  pocketbaseSsoOidcAuthUrl: https://login.microsoftonline.com/your-tenant-id/oauth2/v2.0/authorize
  pocketbaseSsoOidcTokenUrl: https://login.microsoftonline.com/your-tenant-id/oauth2/v2.0/token
  pocketbaseSsoOidcUserInfoUrl: https://graph.microsoft.com/oidc/userinfo
  pocketbaseSsoOidcPkce: true
  pocketbaseRecreateCollections: false
  newsletterTelemetry: false

persistence:
  enabled: true
  storageClass: fast-ssd
  size: 20Gi

ingress:
  frontend:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "110m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    host: newsletter.example.com
    path: /
    pathType: Prefix
    tls:
      - secretName: newsletter-tls
        hosts:
          - newsletter.example.com
  pocketbase:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: "110m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    host: pb.example.com
    path: /
    pathType: Prefix
    tls:
      - secretName: pocketbase-tls
        hosts:
          - pb.example.com

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
