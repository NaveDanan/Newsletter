services:
  newsletter:
    image: newsletter:smtp-test
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        pocketbase-dist: ${POCKETBASE_DIST_DIR}
    depends_on:
      - mailpit
    environment:
      APP_PUBLIC_URL: ${SMTP_TEST_APP_PUBLIC_URL:-http://localhost:7080}
      POCKETBASE_APP_NAME: ${POCKETBASE_APP_NAME:-}
      POCKETBASE_SUPERUSER_EMAIL: ${POCKETBASE_SUPERUSER_EMAIL}
      POCKETBASE_SUPERUSER_PASSWORD: ${POCKETBASE_SUPERUSER_PASSWORD}
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:-}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:-}
      POCKETBASE_MAIL_SENDER_NAME: ${POCKETBASE_MAIL_SENDER_NAME:-SMTP Test}
      POCKETBASE_MAIL_SENDER_ADDRESS: ${POCKETBASE_MAIL_SENDER_ADDRESS:-newsletter@example.com}
      POCKETBASE_PUBLIC_URL: ${POCKETBASE_PUBLIC_URL:-}
      POCKETBASE_SMTP_ENABLED: 1
      POCKETBASE_SMTP_HOST: mailpit
      POCKETBASE_SMTP_PORT: 1025
      POCKETBASE_SMTP_USERNAME: ""
      POCKETBASE_SMTP_PASSWORD: ""
      POCKETBASE_SMTP_AUTH_METHOD: ${POCKETBASE_SMTP_AUTH_METHOD:-PLAIN}
      POCKETBASE_SMTP_TLS: 0
      POCKETBASE_SMTP_INSECURE_SKIP_VERIFY: 0
      POCKETBASE_SMTP_LOCAL_NAME: ${POCKETBASE_SMTP_LOCAL_NAME:-}
      POCKETBASE_SSO_OIDC_ENABLED: ${POCKETBASE_SSO_OIDC_ENABLED:-}
      POCKETBASE_SSO_OIDC_PROVIDER_NAME: ${POCKETBASE_SSO_OIDC_PROVIDER_NAME:-}
      POCKETBASE_SSO_OIDC_DISPLAY_NAME: ${POCKETBASE_SSO_OIDC_DISPLAY_NAME:-}
      POCKETBASE_SSO_OIDC_CLIENT_ID: ${POCKETBASE_SSO_OIDC_CLIENT_ID:-}
      POCKETBASE_SSO_OIDC_CLIENT_SECRET: ${POCKETBASE_SSO_OIDC_CLIENT_SECRET:-}
      POCKETBASE_SSO_OIDC_AUTH_URL: ${POCKETBASE_SSO_OIDC_AUTH_URL:-}
      POCKETBASE_SSO_OIDC_TOKEN_URL: ${POCKETBASE_SSO_OIDC_TOKEN_URL:-}
      POCKETBASE_SSO_OIDC_USER_INFO_URL: ${POCKETBASE_SSO_OIDC_USER_INFO_URL:-}
      POCKETBASE_SSO_OIDC_PKCE: ${POCKETBASE_SSO_OIDC_PKCE:-}
      POCKETBASE_RECREATE_COLLECTIONS: ${POCKETBASE_RECREATE_COLLECTIONS:-0}
    ports:
      - "${SMTP_TEST_FRONTEND_PORT:-7080}:8080"
      - "${SMTP_TEST_POCKETBASE_PORT:-7090}:8090"
    volumes:
      - pocketbase_data:/pb_data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${SMTP_TEST_MAILPIT_SMTP_PORT:-7025}:1025"
      - "${SMTP_TEST_MAILPIT_WEB_PORT:-7026}:8025"

volumes:
  pocketbase_data:
